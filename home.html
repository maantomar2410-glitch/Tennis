<!DOCTYPE html>
<html>
<head>
    <title>Tennis Analyzer</title>
</head>
<body>
    <h1>{{p1}} vs {{p2}}</h1>
    <p> Server: {{server}}</p>

    
    <form action="/log" method="POST">
        <h3>Which Player:</h3>
        <input type="radio" name="player" value="{{p1}}" checked> {{p1}}
        <input type="radio" name="player" value="{{p2}}" > {{p2}}
        <h3>Which Shot:</h3>
        <button name="shot" value="Ace">Ace</button>
        <button name="shot" value="Forehand_error">Forehand Error</button>
        <button name="shot" value="Backhand_error">Backhand Error</button>
        <button name="shot" value="Serve_in">Serve In</button>
        <button name="shot" value="Serve_out">Serve Out</button>

    </form>
    <h2>STATS</h2>
    <table border="1">
        <tr><th></th><th>{{p1}}</th><th>{{p2}}</th></tr>
        <tr><td>Aces</td><td>{{stats.p1_Aces}}</td><td>{{stats.p2_Aces}}</td></tr>
        <tr><td>Forehand Errors</td><td>{{stats.p1_fh_err}}</td><td>{{stats.p2_fh_err}}</td></tr>
        <tr><td>Backhand Errors</td><td>{{stats.p1_bh_err}}</td><td>{{stats.p2_bh_err}}</td></tr>
    </table>
</body>
</html>
