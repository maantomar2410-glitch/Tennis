<!DOCTYPE html>
<html>
<head>
    <title> Setup</title>
</head>
<body>
    <form action="/start" method="POST">
        <input type="text" name="player1" placeholder="Player 1 name">
        <input type="text" name="player2" placeholder="Player 2 name">
        <br>
        <input type="radio" name="server" value="player1"> Player 1 serves
        <input type="radio" name="server" value="player2"> Player 2 serves
        <br>
        <button type="submit">Start Match</button>
    </form>
</body>
    
</html>
